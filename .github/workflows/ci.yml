name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Blender as Python module
        run: pip install bpy==5.3.0
      - name: Run tests
        run: python tests/run_tests.py
      - name: Build extension ZIP
        run: python scripts/build_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: parametric_design
          path: dist/*.zip
      - name: Attach ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber || gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
